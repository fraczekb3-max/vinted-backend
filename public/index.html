<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xenon TxT - Pobieralnia Texture Packów</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: #0f111a; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
        header { text-align: center; margin-bottom: 30px; }
        h1 { color: #5865F2; margin-bottom: 10px; font-size: 2.5rem; }
        .card { background: #1a1d28; padding: 25px; border-radius: 12px; width: 100%; max-width: 550px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        .btn-discord { background-color: #5865F2; color: white; padding: 12px 24px; text-decoration: none; font-weight: bold; border-radius: 8px; display: inline-block; transition: 0.2s; border: none; cursor: pointer; font-size: 1rem; width: 100%; text-align: center; }
        .btn-discord:hover { background-color: #4752C4; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-size: 0.9rem; color: #a0a5b5; }
        input, select, textarea { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #2e3346; background: #0f111a; color: #fff; font-size: 0.95rem; }
        input:focus, select:focus, textarea:focus { border-color: #5865F2; outline: none; }
        .user-info { display: flex; align-items: center; gap: 12px; background: #232736; padding: 10px 15px; border-radius: 8px; margin-bottom: 20px; }
        .user-info img { border-radius: 50%; width: 40px; height: 40px; }
        .hidden { display: none; }
        .alert { background: #ed4245; color: white; padding: 12px; border-radius: 8px; margin-bottom: 15px; text-align: center; }
    </style>
</head>
<body>

    <header>
        <h1>Xenon TxT</h1>
        <p>Oficjalna baza texture packów</p>
    </header>

    <div class="card">
        <!-- Widok dla niezalogowanego -->
        <div id="auth-section">
            <p style="margin-bottom: 20px; text-align: center;">Aby dodać własną paczkę zasobów, zaloguj się przez Discorda. Wymagana jest ranga <b>txt</b>.</p>
            <a href="https://discord.com/oauth2/authorize?client_id=1546979303487438961&response_type=code&redirect_uri=https%3A%2F%2Ftxtxtx.onrender.com%2Fapi%2Fauth%2Fcallback&scope=identify" class="btn-discord">
                Zaloguj się przez Discord
            </a>
        </div>

        <!-- Komunikat braku permisji -->
        <div id="no-permission-alert" class="alert hidden">
            ❌ Nie posiadasz permisji (brak rangi <b>txt</b> na serwerze), aby dodawać paczki!
        </div>

        <!-- Formularz dodawania paczki (widoczny tylko z rangą txt) -->
        <div id="upload-section" class="hidden">
            <div class="user-info">
                <img id="user-avatar" src="" alt="Avatar">
                <div>
                    <strong id="user-name">Nick</strong>
                    <div style="font-size: 0.8rem; color: #57F287;">✔ Posiadasz rangę TXT</div>
                </div>
            </div>

            <form id="txt-form">
                <div class="form-group">
                    <label>Tytuł paczki</label>
                    <input type="text" placeholder="np. Purple Fade 64x" required>
                </div>

                <div class="form-group">
                    <label>Wybór serwera</label>
                    <select required>
                        <option value="Anarchia">Anarchia.GG</option>
                        <option value="MineSerwer">MineSerwer</option>
                        <option value="Pozostałe">Pozostałe TxT</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Tryb gry</label>
                    <select required>
                        <option value="BoxPvP">Box PvP</option>
                        <option value="SkyPvP">Sky PvP</option>
                        <option value="Anarchia">Anarchia</option>
                        <option value="Inny">Inny</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Wersja Minecraft</label>
                    <input type="text" placeholder="np. 1.8.9 lub 1.16 - 1.21" required>
                </div>

                <div class="form-group">
                    <label>Opis paczki</label>
                    <textarea rows="3" placeholder="Krótki opis wyglądu paczki, mieczy, nieba itp."></textarea>
                </div>

                <div class="form-group">
                    <label>Link do pobrania (MediaFire / Google Drive)</label>
                    <input type="url" placeholder="https://..." required>
                </div>

                <button type="submit" class="btn-discord" style="background-color: #57F287; color: #000;">
                    Opublikuj Texture Pack
                </button>
            </form>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const status = urlParams.get('status');
        const user = urlParams.get('user');
        const avatar = urlParams.get('avatar');

        if (status === 'success') {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('upload-section').classList.remove('hidden');
            document.getElementById('user-name').innerText = user;
            if (avatar) {
                document.getElementById('user-avatar').src = avatar;
            }
        } else if (status === 'no_role') {
            document.getElementById('no-permission-alert').classList.remove('hidden');
        }

        document.getElementById('txt-form').addEventListener('submit', (e) => {
            e.preventDefault();
            alert('Paczka została pomyślnie zgłoszona!');
        });
    </script>
</body>
</html>
