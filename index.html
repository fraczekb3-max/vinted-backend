<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generator Opisów AI - Vinted</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; text-align: center; padding: 20px; }
    .card { background: #1e293b; max-width: 500px; margin: 30px auto; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    input, select, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; box-sizing: border-box; }
    button { background: #0070f3; color: white; font-weight: bold; cursor: pointer; font-size: 16px; }
    button:hover { background: #0051a2; }
    .btn-pay { background: #22c55e; text-decoration: none; display: block; line-height: 40px; border-radius: 8px; color: white; font-weight: bold; margin-top: 10px; }
    .btn-pay:hover { background: #16a34a; }
    #result { margin-top: 15px; background: #0f172a; padding: 10px; border-radius: 8px; white-space: pre-wrap; text-align: left; }
  </style>
</head>
<body>

  <div class="card">
    <h1>Generator Opisów AI</h1>
    <p>Kup dostęp lub wpisz posiadany kod, aby wygenerować opis z AI.</p>
    
    <!-- Kupno dostępu przez SimPay -->
    <a class="btn-pay" href="https://simpay.pl/db/72432e0b" target="_blank">🛒 Kup kod dostępu (SimPay)</a>

    <hr style="border-color: #334155; margin: 20px 0;">

    <!-- Formularz generatora -->
    <input type="text" id="accessCode" placeholder="Wpisz kod dostępu (np. LIFE-XXXXXX)">
    
    <select id="platform">
      <option value="vinted">Vinted</option>
      <option value="olx">OLX</option>
      <option value="allegro">Allegro</option>
    </select>

    <input type="file" id="imageInput" accept="image/*" multiple>

    <button onclick="generateDescription()">⚡ Wygeneruj opis</button>

    <div id="status"></div>
    <div id="result"></div>
  </div>

  <script>
    const BACKEND_URL = 'https://vinted-backend-yvhv.onrender.com';

    async function generateDescription() {
      const code = document.getElementById('accessCode').value.trim();
      const platform = document.getElementById('platform').value;
      const fileInput = document.getElementById('imageInput');
      const statusDiv = document.getElementById('status');
      const resultDiv = document.getElementById('result');

      if (!code) {
        alert('Proszę podać kod dostępu!');
        return;
      }

      if (fileInput.files.length === 0) {
        alert('Wybierz przynajmniej jedno zdjęcie!');
        return;
      }

      statusDiv.innerText = 'Weryfikacja kodu...';
      resultDiv.innerText = '';

      try {
        // 1. Weryfikacja kodu w bazie
        const verifyRes = await fetch(`${BACKEND_URL}/api/verify-code`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code })
        });

        const verifyData = await verifyRes.json();

        if (!verifyRes.ok || !verifyData.valid) {
          statusDiv.innerText = '';
          alert(verifyData.message || 'Kod jest nieprawidłowy lub wygasł.');
          return;
        }

        statusDiv.innerText = 'Generowanie opisu przez AI... Chwilkę to potrwa.';

        // 2. Konwersja zdjęć na base64
        const images = [];
        for (let file of fileInput.files) {
          const base64 = await toBase64(file);
          images.push({
            mimeType: file.type,
            base64: base64.split(',')[1]
          });
        }

        // 3. Wywołanie AI z backendu
        const aiRes = await fetch(`${BACKEND_URL}/api/generate`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code, platform, images })
        });

        const aiData = await aiRes.json();

        if (!aiRes.ok) {
          statusDiv.innerText = '';
          alert('Błąd podczas generowania opisu: ' + (aiData.error || 'Nieznany błąd'));
          return;
        }

        statusDiv.innerText = 'Gotowe!';
        resultDiv.innerText = typeof aiData === 'string' ? aiData : JSON.stringify(aiData, null, 2);

      } catch (err) {
        console.error(err);
        statusDiv.innerText = '';
        alert('Wystąpił błąd połączenia z serwerem.');
      }
    }

    function toBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
      });
    }
  </script>
</body>
</html>
